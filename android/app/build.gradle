def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'dev.flutter.flutter-gradle-plugin'
apply plugin: 'com.google.gms.google-services' // für Firebase / google-services.json

android {
    namespace "com.quinten.atyourservice"
    compileSdkVersion flutter.compileSdkVersion

    // *** Wichtig: NDK-Version auf 27.0.12077973 festlegen! ***
    ndkVersion "27.0.12077973"

    // === Java / Desugaring ===
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.quinten.atyourservice"
        minSdkVersion flutter.minSdkVersion // für firebase_messaging ok
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName

        // FCM / viele Abhängigkeiten
        multiDexEnabled true
    }

    // === DEBUG AUSGABE BEGINN ===
    println("=== KEYSTORE DEBUG ===")
    println("storeFile: ${keystoreProperties['storeFile']}")
    println("storePassword: ${keystoreProperties['storePassword']}")
    println("keyAlias: ${keystoreProperties['keyAlias']}")
    println("keyPassword: ${keystoreProperties['keyPassword']}")
    println("======================")
    // === DEBUG AUSGABE ENDE ===

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
            // Falls benötigt:
            // proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            // optional
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Firebase BOM (verwaltet Versionen zentral)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')

    // Firebase Core + FCM + Analytics (Versionen kommen aus BOM)
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-analytics'

    // MultiDex Support
    implementation 'androidx.multidex:multidex:2.0.1'

    // === Desugaring (erforderlich für flutter_local_notifications) ===
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
