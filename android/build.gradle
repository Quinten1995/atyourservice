buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Android Gradle Plugin – deine Version ist ok
        classpath 'com.android.tools.build:gradle:8.2.0'
        // Google Services Plugin für Firebase (für google-services.json)
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Optionaler Clean-Task
tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
